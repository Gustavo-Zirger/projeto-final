# se mudar algo nesse arquivo, é necessário recriar os containers com o comando: 
# docker compose down -v && docker compose up -d
#adicionar volumes pra salvar os dados do banco e da aplicação
# pra comunnicar as portas dei iptables-legacy -P FORWARD ACCEPT
services:
  bd:
    image: postgres:14
    networks:
      - moodle
    environment:
      - POSTGRES_USER=user_moodle
      - POSTGRES_PASSWORD=pw_moodle
      - POSTGRES_DB=pg_moodle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_moodle -d pg_moodle"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  aplicacao_web:
    image: bitnamilegacy/moodle
    networks:
      - moodle
    depends_on:
      bd:
        condition: service_healthy
    environment:
      - MOODLE_HOST=cautious-space-adventure-4j9wqjjrp4gwf95p-80.app.github.dev
      - BITNAMI_DEBUG=true
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=bd
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_USER=user_moodle
      - MOODLE_DATABASE_PASSWORD=pw_moodle
      - MOODLE_DATABASE_NAME=pg_moodle
    ports:
      - "80:8080"
    volumes:
      - moodle_config:/bitnami/moodle
      - moodle_dados:/bitnami/moodledata

networks:
  moodle:
    driver: bridge

volumes:
  pg_data:
  moodle_config:
  moodle_dados: